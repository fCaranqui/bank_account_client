include:
  - Account/docker-compose.yml
  - Client/docker-compose.yml

services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - messaging-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5

  account-api:
    build:
      context: ./Account
      dockerfile: Account.Api/Dockerfile
    container_name: account-api
    depends_on:
      account-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AccountDb: "Host=account-db;Port=5432;Database=account_db;Username=postgres;Password=postgres"
      RabbitMq__Host: rabbitmq
    ports:
      - "8081:8080"
    networks:
      - account-net
      - messaging-net

  client-api:
    build:
      context: ./Client
      dockerfile: Client.Api/Dockerfile
    container_name: client-api
    depends_on:
      client-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ClientDb: "Host=client-db;Port=5432;Database=client_db;Username=postgres;Password=postgres"
      RabbitMq__Host: rabbitmq
    ports:
      - "8080:8080"
    networks:
      - client-net
      - messaging-net

networks:
  messaging-net:

volumes:
  rabbitmq-data:
